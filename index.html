<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyLingo - Apprends Python</title>
    
    <!-- Paramètres iOS (Web App & Icone) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PyLingo">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CodeMirror pour l'éditeur de code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    
    <!-- Pyodide pour exécuter Python dans le navigateur -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #131f24;
            color: white;
            overscroll-behavior: none;
        }
        
        /* Personnalisation de l'éditeur CodeMirror */
        .CodeMirror {
            border-radius: 0.75rem;
            height: 100% !important;
            font-size: 16px;
            font-family: monospace;
            background-color: #1e293b !important;
        }
        
        /* Cache la scrollbar globale pour un look app */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

        .path-node {
            transition: transform 0.2s;
        }
        .path-node:active {
            transform: scale(0.95);
        }
        
        .pulse-ring {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(88, 204, 2, 0); }
            100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); }
        }

        /* Drawer d'évaluation */
        #feedback-drawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
        }
        #feedback-drawer.open {
            transform: translateY(0);
        }

        /* Styles pour les descriptions d'exercices */
        .exo-concept {
            background: rgba(88, 204, 2, 0.08);
            border-left: 3px solid #58cc02;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            font-size: 0.88rem;
            line-height: 1.7;
            color: #c8d6e5;
        }
        .exo-example {
            background: rgba(206, 130, 255, 0.08);
            border-left: 3px solid #ce82ff;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d5c4e8;
        }
        .exo-example code {
            color: #e2b6ff;
        }
        .exo-task {
            background: rgba(255, 200, 0, 0.1);
            border-left: 3px solid #ffc800;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0e6c8;
            line-height: 1.6;
        }
        .lesson-desc-area code {
            background: rgba(255,255,255,0.1);
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
            color: #a3e635;
        }
        .exo-task code {
            color: #ffd866;
        }

        /* Section headers sur la carte */
        .section-header {
            background: linear-gradient(135deg, #1e3a4a 0%, #202f36 100%);
            border: 2px solid #2d4a5a;
            padding: 10px 24px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .section-header .section-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }
        .section-header .section-title {
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
        }

        /* Indicateur de sauvegarde */
        .save-flash {
            animation: saveFlash 2s ease-out forwards;
        }
        @keyframes saveFlash {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-5px); }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e3a4a;
            border: 1px solid #58cc02;
            color: #a3e635;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .rainbow-text {
            background: linear-gradient(to right, #ef4444, #f97316, #f59e0b, #84cc16, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- Écran de chargement Pyodide -->
    <div id="loading-screen" class="absolute inset-0 z-50 bg-[#131f24] flex flex-col items-center justify-center">
        <i class="ph ph-spinner-gap animate-spin text-6xl text-[#58cc02] mb-4"></i>
        <h1 class="text-2xl font-bold text-white mb-2">PyLingo</h1>
        <p class="text-gray-400 font-semibold" id="loading-text">Installation du moteur Python...</p>
    </div>

    <!-- Modal PyLingo Pro -->
    <div id="pro-modal" class="fixed inset-0 z-[60] bg-black/80 hidden flex-col items-center justify-center p-4">
        <div class="bg-[#131f24] border-2 border-gray-700 rounded-2xl w-full max-w-sm p-6 flex flex-col items-center text-center relative shadow-2xl">
            <button onclick="closeProModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 text-2xl transition-colors">
                <i class="ph ph-x"></i>
            </button>
            <div class="relative mb-3">
                <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-[#ef4444] via-[#f59e0b] to-[#8b5cf6] opacity-75 blur"></div>
                <img src="apple-touch-icon.png" class="relative w-20 h-20 rounded-2xl shadow-xl" alt="PyLingo Pro Logo">
            </div>
            <h2 class="text-3xl font-extrabold mb-2 rainbow-text tracking-wider">PyLingo Pro</h2>
            <p id="pro-modal-msg" class="text-gray-300 mb-6 font-semibold">Débloquez l'accès illimité en entrant votre clé secrète.</p>
            <input type="password" id="pro-key-input" placeholder="Clé secrète" class="w-full bg-[#1e293b] border-2 border-gray-600 rounded-xl p-3 text-white font-bold mb-4 focus:outline-none focus:border-[#58cc02] transition-colors text-center" onkeydown="if(event.key === 'Enter') submitProKey()">
            <button onclick="submitProKey()" class="w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3 rounded-xl transition-all active:scale-95 text-lg shadow-[0_4px_0_#46a302]">
                Valider
            </button>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast">
        <i class="ph-fill ph-cloud-check text-lg"></i>
        <span id="toast-text">Progression chargée !</span>
    </div>

    <!-- VUE 1 : LA CARTE (MAP) -->
    <div id="map-view" class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Header Map -->
        <div class="h-16 border-b border-gray-700 flex items-center justify-between px-4 bg-[#131f24] shrink-0 sticky top-0 z-10">
            <div class="flex flex-col items-start gap-0">
                <div class="flex items-center gap-2">
                    <img src="logo.png" alt="PyLingo Logo" class="w-8 h-8 rounded-lg shadow-sm">
                    <span id="app-title" class="font-bold text-xl tracking-wider">PyLingo</span>
                </div>
                <span class="text-[10px] text-gray-400" style="line-height: 1;">Codé par Mohamed Mehdi Tannoubi</span>
            </div>
            <div class="flex items-center gap-4 font-bold">
                <!-- Save indicator -->
                <div id="save-indicator" class="flex items-center gap-1 text-xs text-green-400 opacity-0 transition-opacity duration-500">
                    <i class="ph ph-cloud-check"></i>
                    <span>Sauvé</span>
                </div>
                <div class="flex items-center gap-1 text-[#ffc800]" title="Ton XP">
                    <i class="ph-fill ph-crown text-xl"></i>
                    <span id="xp-counter">0 XP</span>
                </div>
                <div class="flex items-center gap-1 text-[#ff4b4b] cursor-pointer" onclick="unlockPro()" title="Passer Pro">
                    <i class="ph-fill ph-heart text-xl"></i>
                    <span id="lives-counter">5</span>
                </div>
                <!-- Notif button -->
                <button id="notif-btn" onclick="requestNotifications()" class="text-gray-500 hover:text-yellow-400 transition-colors" title="Activer les rappels">
                    <i class="ph ph-bell text-lg"></i>
                </button>
                <!-- Upload / Download Save -->
                <button onclick="downloadSave()" class="text-gray-500 hover:text-[#58cc02] transition-colors" title="Télécharger la sauvegarde">
                    <i class="ph ph-download-simple text-lg"></i>
                </button>
                <button onclick="document.getElementById('upload-save').click()" class="text-gray-500 hover:text-[#58cc02] transition-colors" title="Charger une sauvegarde">
                    <i class="ph ph-upload-simple text-lg"></i>
                </button>
                <input type="file" id="upload-save" class="hidden" accept=".json" onchange="uploadSave(event)">
                <!-- Reset button -->
                <button onclick="resetProgress()" class="text-gray-500 hover:text-gray-300 transition-colors" title="Réinitialiser la progression">
                    <i class="ph ph-arrow-counter-clockwise text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Chemin d'apprentissage (défilement inversé) -->
        <div id="path-container" class="flex-1 overflow-y-auto overflow-x-hidden p-6 pb-32 flex flex-col-reverse items-center gap-8">
            <!-- Les nœuds seront générés ici en JS -->
        </div>
    </div>

    <!-- VUE 2 : L'EXERCICE (LESSON) -->
    <div id="lesson-view" class="fixed inset-0 z-40 bg-[#131f24] flex flex-col hidden">
        <!-- Header Lesson -->
        <div class="h-14 flex items-center px-4 shrink-0">
            <button onclick="closeLesson()" class="text-gray-400 hover:text-white text-2xl p-2">
                <i class="ph ph-x"></i>
            </button>
            <div class="flex-1 mx-4">
                <div class="h-4 bg-gray-700 rounded-full w-full overflow-hidden">
                    <div id="lesson-progress-bar" class="h-full bg-[#58cc02] w-0 transition-all duration-300"></div>
                </div>
            </div>
            <div class="text-gray-400 font-bold" id="lesson-number-display">1/100</div>
        </div>

        <!-- Contenu de l'exercice -->
        <div class="flex-1 overflow-y-auto flex flex-col md:flex-row p-4 gap-4 pb-40">
            
            <!-- Instructions (Gauche sur PC, Haut sur Mobile) -->
            <div class="md:w-1/3 flex flex-col gap-3 lesson-desc-area">
                <div class="flex items-end gap-3">
                    <div class="w-16 h-16 bg-[#202f36] rounded-2xl flex items-center justify-center border-2 border-gray-600 shrink-0">
                        <i class="ph-fill ph-snake text-4xl text-[#58cc02]"></i>
                    </div>
                    <div class="bg-[#202f36] border border-gray-600 p-4 rounded-2xl rounded-bl-none relative flex-1 shadow-lg">
                        <h2 id="lesson-title" class="font-bold text-xl mb-3 text-white">Titre</h2>
                        <div id="lesson-desc" class="text-gray-300 leading-relaxed text-sm">Description de l'exercice.</div>
                    </div>
                </div>
                <!-- Bouton Indice -->
                <div id="hint-container" class="hidden">
                    <button onclick="toggleHint()" id="hint-toggle-btn" class="w-full bg-[#202f36] border border-gray-600 hover:border-[#ce82ff] text-gray-400 hover:text-[#ce82ff] font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all text-sm">
                        <i class="ph ph-lightbulb text-lg"></i>
                        <span id="hint-btn-text">💡 Voir un indice</span>
                    </button>
                    <div id="hint-content" class="hidden mt-2 bg-[#1a2a33] border border-[#ce82ff]/30 p-4 rounded-xl text-sm text-[#d5c4e8] leading-relaxed">
                    </div>
                </div>
            </div>

            <!-- Editeur et Console (Droite sur PC, Bas sur Mobile) -->
            <div class="md:w-2/3 flex flex-col gap-4 h-[50vh] md:h-auto min-h-[400px]">
                <div class="flex-1 rounded-xl overflow-hidden border-2 border-gray-700 flex flex-col">
                    <div class="bg-gray-800 px-3 py-1 text-xs font-bold text-gray-400 flex justify-between items-center">
                        <span>main.py</span>
                        <button onclick="runCode()" class="text-[#58cc02] hover:text-green-400 flex items-center gap-1">
                            <i class="ph-fill ph-play"></i> Exécuter
                        </button>
                    </div>
                    <div class="flex-1 relative">
                        <textarea id="code-editor"></textarea>
                    </div>
                </div>

                <!-- Console -->
                <div class="h-1/3 min-h-[120px] bg-black rounded-xl border-2 border-gray-700 flex flex-col">
                    <div class="bg-gray-800 px-3 py-1 text-xs font-bold text-gray-400">Console</div>
                    <div class="flex-1 p-2 overflow-y-auto font-mono text-sm text-gray-300" id="console-output">
                        > Prêt...
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer / Feedback Drawer -->
        <div class="absolute bottom-0 left-0 right-0 z-50">
            <!-- Bouton principal par défaut -->
            <div id="action-bar" class="bg-[#131f24] border-t border-gray-700 p-4 flex justify-center md:justify-end">
                <button onclick="checkAnswer()" class="w-full md:w-auto bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3 px-8 rounded-xl shadow-[0_4px_0_#46a302] active:shadow-none active:translate-y-1 transition-all text-lg">
                    Vérifier
                </button>
            </div>

            <!-- Drawer de résultat (Caché par défaut) -->
            <div id="feedback-drawer" class="absolute bottom-0 w-full p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div id="feedback-icon" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold bg-white"></div>
                    <div>
                        <h3 id="feedback-title" class="text-2xl font-bold mb-1">Feedback</h3>
                        <p id="feedback-msg" class="text-lg opacity-90">Message</p>
                    </div>
                </div>
                <button id="feedback-btn" class="w-full md:w-auto font-bold py-3 px-8 rounded-xl shadow-[0_4px_0_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-1 transition-all text-lg">
                    Continuer
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. GÉNÉRATION DES 100 EXERCICES ---
        const exercisesData = [];
        
        function addEx(title, desc, code, test, hint) {
            let isMilestone = (exercisesData.length + 1) % 10 === 0;
            exercisesData.push({ id: exercisesData.length + 1, title, desc, code, test, hint: hint || '', isMilestone });
        }

        // ═══════════════════════════════════════════
        // NIVEAU 1 : LES BASES (1-10)
        // ═══════════════════════════════════════════

        addEx("Premier contact",
            `<div class="exo-concept">En Python, la fonction <code>print()</code> sert à <b>afficher du texte</b> à l'écran. C'est la toute première commande que tout programmeur apprend !<br>Pour afficher un mot, on le met entre <b>guillemets</b> (apostrophes) à l'intérieur des parenthèses.</div>
            <div class="exo-example">Par exemple : <code>print('Hello')</code> affiche le mot <b>Hello</b> dans la console.</div>
            <div class="exo-task">✏️ Écris le mot <code>'Bonjour'</code> entre les parenthèses du <code>print()</code> pour l'afficher.</div>`,
            "print()",
            "assert 'Bonjour' in __out, \"Assure-toi d'afficher exactement 'Bonjour'\"",
            "Écris exactement : <code>print('Bonjour')</code><br>N'oublie pas les apostrophes autour du mot !");

        addEx("Afficher Python",
            `<div class="exo-concept">Tu sais maintenant utiliser <code>print()</code> ! Le texte qu'on met entre guillemets s'appelle une <b>chaîne de caractères</b> (ou « string » en anglais). Sans les guillemets, Python pense que c'est un nom de variable.</div>
            <div class="exo-task">✏️ Remplace les <code>???</code> par le mot <code>Python</code> (avec les guillemets) pour l'afficher à l'écran.</div>`,
            "print('???')",
            "assert 'Python' in __out",
            "Remplace <code>???</code> par <code>Python</code> → le code devient <code>print('Python')</code>");

        addEx("Les Variables",
            `<div class="exo-concept">Une <b>variable</b>, c'est comme une boîte avec une étiquette. Tu lui donnes un <b>nom</b> (l'étiquette) et tu y ranges une <b>valeur</b> (le contenu).<br>En Python, on crée une variable avec le signe <code>=</code> (qui veut dire « reçoit la valeur »).</div>
            <div class="exo-example">Exemple : <code>score = 42</code> crée une boîte appelée « score » qui contient le nombre 42.</div>
            <div class="exo-task">✏️ Change la valeur de la variable <code>age</code> : remplace le <code>0</code> par <code>15</code>.</div>`,
            "age = 0",
            "assert age == 15",
            "Modifie la ligne pour écrire : <code>age = 15</code>");

        addEx("Variables de texte",
            `<div class="exo-concept">Les variables ne contiennent pas que des nombres ! On peut aussi y mettre du <b>texte</b>. Pour ça, on met le texte entre guillemets (apostrophes).</div>
            <div class="exo-example">Exemple : <code>prenom = 'Marie'</code> crée une variable contenant le texte « Marie ».</div>
            <div class="exo-task">✏️ Crée une variable appelée <code>nom</code> et donne-lui la valeur <code>'Alice'</code> (avec les apostrophes !).</div>`,
            "",
            "assert nom == 'Alice'",
            "Écris : <code>nom = 'Alice'</code>");

        addEx("Afficher une variable",
            `<div class="exo-concept">Pour afficher le contenu d'une variable, on utilise <code>print()</code> mais <b>sans guillemets</b> autour du nom de la variable. Si tu mets des guillemets, Python affichera le texte au lieu de la valeur !</div>
            <div class="exo-example"><code>print(age)</code> → affiche <b>20</b> (la valeur)<br><code>print('age')</code> → affiche le mot <b>age</b> (le texte)</div>
            <div class="exo-task">✏️ Ajoute <code>print(age)</code> sur la 2ème ligne pour afficher la valeur de <code>age</code>.</div>`,
            "age = 20\n",
            "assert str(age) in __out or '20' in __out",
            "Ajoute sur la ligne vide : <code>print(age)</code> (sans guillemets autour de age)");

        addEx("Changer de valeur",
            `<div class="exo-concept">On peut <b>changer la valeur</b> d'une variable à tout moment ! Il suffit de réutiliser le signe <code>=</code> avec la nouvelle valeur. L'ancienne valeur sera remplacée.</div>
            <div class="exo-example">Exemple :<br><code>x = 5</code> → x vaut 5<br><code>x = 10</code> → maintenant x vaut 10</div>
            <div class="exo-task">✏️ Sur la ligne du commentaire, écris <code>score = 100</code> pour changer la valeur de score.</div>`,
            "score = 0\n# Modifie score ici\n",
            "assert score == 100",
            "Remplace le commentaire par : <code>score = 100</code>");

        addEx("Concaténation",
            `<div class="exo-concept">On peut <b>coller</b> deux textes ensemble avec le signe <code>+</code>. Ça s'appelle la <b>concaténation</b>. Attention : ça ne marche qu'entre des textes (strings), pas entre un texte et un nombre.</div>
            <div class="exo-example">Exemple : <code>'Bon' + 'jour'</code> donne <code>'Bonjour'</code></div>
            <div class="exo-task">✏️ Remplace <code>???</code> par le nom de la variable <code>nom</code> (sans guillemets) pour afficher « Salut Bob ».</div>`,
            "mot = 'Salut '\nnom = 'Bob'\nprint(mot + ???)",
            "assert 'Salut Bob' in __out",
            "Remplace <code>???</code> par <code>nom</code> → <code>print(mot + nom)</code>");

        addEx("Types de données",
            `<div class="exo-concept">En Python, il existe plusieurs <b>types de données</b> :<br>• <b>int</b> (nombre entier) : <code>42</code><br>• <b>str</b> (texte) : <code>'Hello'</code><br>• <b>bool</b> (vrai/faux) : <code>True</code> ou <code>False</code><br>⚠️ Les booléens commencent toujours par une <b>majuscule</b> !</div>
            <div class="exo-task">✏️ Crée une variable <code>est_vrai</code> qui contient la valeur <code>True</code> (avec un T majuscule).</div>`,
            "",
            "assert est_vrai == True",
            "Écris : <code>est_vrai = True</code> (attention à la majuscule !)");

        addEx("L'erreur classique",
            `<div class="exo-concept">Quand Python voit un mot <b>sans guillemets</b>, il pense que c'est le nom d'une variable. Si cette variable n'existe pas, il affiche une erreur <code>NameError</code>.<br>C'est l'une des erreurs les plus fréquentes chez les débutants !</div>
            <div class="exo-example"><code>print(Bonjour)</code> → ❌ Erreur ! Python cherche une variable « Bonjour »<br><code>print('Bonjour')</code> → ✅ Affiche le texte « Bonjour »</div>
            <div class="exo-task">✏️ Corrige le code en ajoutant des <b>guillemets</b> autour de <code>Bonjour</code> pour que ça devienne du texte.</div>`,
            "print(Bonjour)",
            "assert 'Bonjour' in __out",
            "Ajoute des apostrophes : <code>print('Bonjour')</code>");

        // --- 3. ETAT DE L'APPLICATION ---
        const STORAGE_KEY = 'pylingo_save_v1';
        let currentProgress = 1;
        let activeLessonId = null;
        let xp = 0;
        let pyodideInstance = null;
        let editor;

        // --- 4. SYSTÈME DE SAUVEGARDE (localStorage par appareil) ---
        let dailyLessonsCount = 0;
        let lastPlayedDate = new Date().toDateString();
        let unlockedKey = false;
        let playerName = "";

        function saveProgress() {
            try {
                const saveData = {
                    currentProgress: currentProgress,
                    xp: xp,
                    dailyLessonsCount: dailyLessonsCount,
                    lastPlayedDate: lastPlayedDate,
                    unlockedKey: unlockedKey,
                    playerName: playerName,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
                showSaveIndicator();
            } catch(e) {
                console.error('Erreur de sauvegarde:', e);
            }
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    currentProgress = Math.min(Math.max(data.currentProgress || 1, 1), 101);
                    xp = data.xp || 0;
                    dailyLessonsCount = data.dailyLessonsCount || 0;
                    lastPlayedDate = data.lastPlayedDate || new Date().toDateString();
                    unlockedKey = data.unlockedKey || false;
                    playerName = data.playerName || "";
                    
                    const today = new Date().toDateString();
                    if (lastPlayedDate !== today) {
                        dailyLessonsCount = 0;
                        lastPlayedDate = today;
                    }
                    return true;
                }
            } catch(e) {
                console.error('Erreur de chargement:', e);
            }
            return false;
        }

        function downloadSave() {
            saveProgress();
            const saved = localStorage.getItem(STORAGE_KEY);
            if(!saved) return;
            const blob = new Blob([saved], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "pylingo_save.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function uploadSave(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && data.currentProgress) {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                        loadProgress();
                        renderMap();
                        updateXPDisplay();
                        showToast("Sauvegarde synchronisée !");
                    } else {
                        alert("Fichier de sauvegarde invalide.");
                    }
                } catch(err) {
                    alert("Erreur lors de la lecture du fichier.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        function resetProgress() {
            if (confirm('⚠️ Remettre ta progression à zéro ?\n\nCette action est irréversible ! Toute ta progression et tes XP seront perdus.')) {
                localStorage.removeItem(STORAGE_KEY);
                currentProgress = 1;
                xp = 0;
                updateXPDisplay();
                renderMap();
                showToast('Progression réinitialisée');
            }
        }

        function showSaveIndicator() {
            const indicator = document.getElementById('save-indicator');
            indicator.style.opacity = '1';
            setTimeout(() => {
                indicator.style.opacity = '0';
            }, 2500);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- 5. SYSTEME AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            // Toujours reprendre le contexte audio (politique navigateur)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'milestone') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                osc.frequency.setValueAtTime(880, now + 0.45);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.setValueAtTime(0.3, now + 0.45);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
                osc.start(now);
                osc.stop(now + 1.0);
            }
        }

        // --- 6. GESTION DE LA CARTE (MAP) ---
        function renderMap() {
            const container = document.getElementById('path-container');
            container.innerHTML = '';
            
            const curveStrength = 60; 

            for (let i = 0; i < exercisesData.length; i++) {
                const ex = exercisesData[i];
                const isLocked = ex.id > currentProgress;
                const isCurrent = ex.id === currentProgress;
                const isDone = ex.id < currentProgress;

                // Section header
                const section = sectionNames.find(s => s.start === ex.id);
                if (section) {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'w-full flex justify-center py-2';
                    sectionDiv.innerHTML = `
                        <div class="section-header" style="border-color: ${section.color}40;">
                            <div class="section-icon">${section.icon}</div>
                            <div class="section-title" style="color: ${section.color};">${section.title}</div>
                        </div>
                    `;
                    container.appendChild(sectionDiv);
                }

                const nodeWrapper = document.createElement('div');
                nodeWrapper.className = 'w-full flex justify-center py-2 relative';
                
                const offset = Math.sin(i * 0.7) * curveStrength;
                
                const btn = document.createElement('button');
                btn.className = `path-node w-20 h-20 rounded-full flex items-center justify-center border-b-4 text-3xl transition-all relative
                    ${isLocked ? 'bg-gray-300 border-gray-400 text-gray-500 cursor-not-allowed opacity-80' : 
                      isDone ? 'bg-[#58cc02] border-[#46a302] text-white hover:bg-[#46a302]' : 
                      'bg-[#ffc800] border-[#cc9f00] text-white hover:bg-[#ffb000] pulse-ring z-10'}`;
                
                btn.style.transform = `translateX(${offset}px)`;
                btn.onclick = () => {
                    if (!isLocked) openLesson(ex.id);
                };

                // Ligne de connexion
                if (i < exercisesData.length - 1) {
                    const nextOffset = Math.sin((i + 1) * 0.7) * curveStrength;
                    const line = document.createElement('div');
                    line.className = `absolute w-2 -top-12 -bottom-2 -z-10 ${isDone ? 'bg-[#58cc02]' : 'bg-gray-300'}`;
                    const tilt = (nextOffset - offset) > 0 ? 15 : -15;
                    line.style.transform = `translateX(${offset + (nextOffset - offset)/2}px) rotate(${tilt}deg)`;
                    nodeWrapper.appendChild(line);
                }

                // Icône
                if (ex.isMilestone) {
                    btn.innerHTML = isLocked ? '<i class="ph-fill ph-lock-key"></i>' : '<i class="ph-fill ph-star"></i>';
                    btn.classList.add('w-24', 'h-24', 'border-b-8');
                    if(isCurrent) btn.classList.replace('bg-[#ffc800]', 'bg-[#ce82ff]');
                    if(isCurrent) btn.classList.replace('border-[#cc9f00]', 'border-[#a552de]');
                } else {
                    btn.innerHTML = isLocked ? '<i class="ph-fill ph-lock-key"></i>' : 
                                    (isDone ? '<i class="ph-fill ph-check"></i>' : '<i class="ph-fill ph-book-open"></i>');
                }

                // Tooltip
                const tooltip = document.createElement('div');
                tooltip.className = 'absolute -top-8 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 pointer-events-none transition-opacity font-bold whitespace-nowrap';
                tooltip.style.transform = `translateX(${offset}px)`;
                tooltip.innerText = `${ex.id}. ${ex.title}`;
                
                btn.onmouseenter = () => tooltip.classList.replace('opacity-0', 'opacity-100');
                btn.onmouseleave = () => tooltip.classList.replace('opacity-100', 'opacity-0');

                nodeWrapper.appendChild(btn);
                nodeWrapper.appendChild(tooltip);
                container.appendChild(nodeWrapper);
                
                if (isCurrent) {
                    setTimeout(() => nodeWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                }
            }
        }

        // --- 7. LOGIQUE DE L'EXERCICE ---
        function openLesson(id) {
            if (!unlockedKey && id >= currentProgress) {
                const today = new Date().toDateString();
                if (lastPlayedDate !== today) {
                    dailyLessonsCount = 0;
                    lastPlayedDate = today;
                    saveProgress();
                    updateXPDisplay();
                }
                if (dailyLessonsCount >= 5) {
                    showProModal("Tu as atteint la limite de 5 leçons par jour !<br>Passe à PyLingo Pro pour continuer en illimité.");
                    return;
                }
            }

            activeLessonId = id;
            const ex = exercisesData[id - 1];
            
            document.getElementById('lesson-title').innerText = `Exercice ${id} : ${ex.title}`;
            document.getElementById('lesson-desc').innerHTML = ex.desc;
            document.getElementById('lesson-number-display').innerText = `${id}/${exercisesData.length}`;
            document.getElementById('lesson-progress-bar').style.width = `${(id / exercisesData.length) * 100}%`;
            
            // Gestion de l'indice
            const hintContainer = document.getElementById('hint-container');
            const hintContent = document.getElementById('hint-content');
            const hintBtnText = document.getElementById('hint-btn-text');
            
            if (ex.hint) {
                hintContainer.classList.remove('hidden');
                hintContent.innerHTML = ex.hint;
                hintContent.classList.add('hidden');
                hintBtnText.innerText = '💡 Voir un indice';
            } else {
                hintContainer.classList.add('hidden');
            }
            
            editor.setValue(ex.code || "");
            setTimeout(() => editor.refresh(), 10);
            
            updateConsoleUI("> Prêt. Clique sur Exécuter !");
            closeDrawer();
            
            document.getElementById('lesson-view').classList.remove('hidden');
        }

        function toggleHint() {
            const hintContent = document.getElementById('hint-content');
            const hintBtnText = document.getElementById('hint-btn-text');
            
            if (hintContent.classList.contains('hidden')) {
                hintContent.classList.remove('hidden');
                hintBtnText.innerText = '🙈 Cacher l\'indice';
            } else {
                hintContent.classList.add('hidden');
                hintBtnText.innerText = '💡 Voir un indice';
            }
        }

        function closeLesson() {
            document.getElementById('lesson-view').classList.add('hidden');
            renderMap();
        }

        function updateConsoleUI(text, isError = false) {
            const out = document.getElementById('console-output');
            out.innerText = text;
            out.style.color = isError ? '#ff4b4b' : '#a3e635';
        }

        // --- 8. EXECUTION PYTHON ---
        async function runPythonCode(codeToRun) {
            const wrapCode = `
import sys
from io import StringIO
sys.stdout = StringIO()

if 'turtle' not in sys.modules:
    import types
    mock_turtle = types.ModuleType('turtle')
    class DummyTurtle:
        def forward(self, *args): pass
        def right(self, *args): pass
        def left(self, *args): pass
        def pencolor(self, *args): pass
        def fillcolor(self, *args): pass
        def begin_fill(self, *args): pass
        def end_fill(self, *args): pass
        def circle(self, *args): pass
    mock_turtle.Turtle = DummyTurtle
    sys.modules['turtle'] = mock_turtle

try:
${codeToRun.split('\n').map(line => '    ' + line).join('\n')}
except Exception as e:
    print(e, file=sys.stderr)
    raise e
finally:
    __captured_out = sys.stdout.getvalue()
`;
            try {
                await pyodideInstance.runPythonAsync(wrapCode);
                const out = pyodideInstance.globals.get("__captured_out");
                return { success: true, output: out };
            } catch (err) {
                let errMsg = err.message.split('File "<exec>"').pop() || err.message;
                return { success: false, output: errMsg.trim() };
            }
        }

        async function runCode() {
            const code = editor.getValue();
            updateConsoleUI("> Exécution...", false);
            const res = await runPythonCode(code);
            
            if (res.success) {
                updateConsoleUI(res.output || "> (Pas de sortie)");
            } else {
                updateConsoleUI("Erreur :\n" + res.output, true);
            }
            return res;
        }

        async function checkAnswer() {
            const btn = document.querySelector('#action-bar button');
            const originalText = btn.innerText;
            btn.innerText = "Vérification...";
            btn.disabled = true;

            const ex = exercisesData[activeLessonId - 1];
            const userCode = editor.getValue();
            
            const res = await runPythonCode(userCode);
            updateConsoleUI(res.output || "> (Pas de sortie)", !res.success);

            if (!res.success) {
                showDrawer(false, "Ton code contient une erreur de syntaxe ou d'exécution.");
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            pyodideInstance.globals.set("__out", res.output || "");
            
            const testWrap = `
${userCode}
${ex.test}
`;
            
            try {
                await pyodideInstance.runPythonAsync(testWrap);
                
                if (ex.isMilestone) {
                    playSound('milestone');
                    triggerConfetti();
                } else {
                    playSound('success');
                }
                showDrawer(true, "Excellent travail !");
            } catch (err) {
                let msg = err.message;
                if (msg.includes('AssertionError') || msg.includes('AssertionError')) {
                    let customMsg = msg.split('AssertionError:').pop().trim();
                    if(customMsg.length > 0 && !customMsg.includes('File')) {
                        showDrawer(false, customMsg);
                    } else {
                        showDrawer(false, "Le résultat n'est pas tout à fait celui attendu. Relis la consigne.");
                    }
                } else {
                    showDrawer(false, "Erreur lors de la validation : " + msg.split('File').pop().trim());
                }
            }

            btn.innerText = originalText;
            btn.disabled = false;
        }

        // --- 9. UI FEEDBACK ---
        function showDrawer(isSuccess, message) {
            const drawer = document.getElementById('feedback-drawer');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-msg');
            const icon = document.getElementById('feedback-icon');
            const btn = document.getElementById('feedback-btn');
            
            drawer.classList.remove('bg-[#58cc02]', 'bg-[#ff4b4b]', 'text-white', 'text-[#791414]', 'text-[#2b5900]');
            btn.classList.remove('bg-white', 'text-[#58cc02]', 'text-[#ff4b4b]', 'hover:bg-gray-100');
            icon.classList.remove('text-[#58cc02]', 'text-[#ff4b4b]');

            if (isSuccess) {
                drawer.classList.add('bg-[#58cc02]', 'text-[#2b5900]');
                icon.innerHTML = '<i class="ph-bold ph-check"></i>';
                icon.classList.add('text-[#58cc02]');
                title.innerText = "Parfait !";
                msg.innerText = message;
                btn.innerText = "Continuer";
                btn.classList.add('bg-white', 'text-[#58cc02]', 'hover:bg-gray-100');
                
                btn.onclick = () => {
                    if (activeLessonId === currentProgress && currentProgress < exercisesData.length) {
                        currentProgress++;
                        xp += 10;
                        dailyLessonsCount++;
                        updateXPDisplay();
                        saveProgress(); // Sauvegarde automatique !
                    }
                    closeLesson();
                };
            } else {
                playSound('error');
                drawer.classList.add('bg-[#ff4b4b]', 'text-[#791414]');
                icon.innerHTML = '<i class="ph-bold ph-x"></i>';
                icon.classList.add('text-[#ff4b4b]');
                title.innerText = "Oups !";
                msg.innerText = message;
                btn.innerText = "Réessayer";
                btn.classList.add('bg-white', 'text-[#ff4b4b]', 'hover:bg-gray-100');
                
                btn.onclick = closeDrawer;
            }

            drawer.classList.add('open');
            document.getElementById('action-bar').classList.add('hidden');
        }

        function closeDrawer() {
            document.getElementById('feedback-drawer').classList.remove('open');
            setTimeout(() => {
                document.getElementById('action-bar').classList.remove('hidden');
            }, 300);
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#58cc02', '#ffc800', '#ce82ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#58cc02', '#ffc800', '#ce82ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function updateXPDisplay() {
            document.getElementById('xp-counter').innerText = `${xp} XP`;
            const appTitle = document.getElementById('app-title');
            const livesCounter = document.getElementById('lives-counter');
            if (appTitle && livesCounter) {
                if (unlockedKey) {
                    appTitle.innerText = "PyLingo Pro";
                    appTitle.classList.add("text-[#ffc800]");
                    livesCounter.innerText = "∞";
                } else {
                    appTitle.innerText = "PyLingo";
                    appTitle.classList.remove("text-[#ffc800]");
                    let livesLeft = 5 - dailyLessonsCount;
                    if (livesLeft < 0) livesLeft = 0;
                    livesCounter.innerText = livesLeft;
                }
            }
        }

        function unlockPro() {
            if (unlockedKey) {
                showToast("Tu es déjà sur PyLingo Pro !");
                return;
            }
            showProModal("Passe à PyLingo Pro pour un accès illimité !<br>Entre ta clé secrète ci-dessous :");
        }

        function showProModal(msg) {
            document.getElementById('pro-modal-msg').innerHTML = msg;
            document.getElementById('pro-key-input').value = '';
            document.getElementById('pro-modal').classList.remove('hidden');
            document.getElementById('pro-modal').classList.add('flex');
            setTimeout(() => document.getElementById('pro-key-input').focus(), 100);
        }

        function closeProModal() {
            document.getElementById('pro-modal').classList.add('hidden');
            document.getElementById('pro-modal').classList.remove('flex');
        }

        function isValidProKey(key) {
            // Key format: PLP-XXXXX-XXXXX where X are alphanumeric
            if (!/^PLP-[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(key)) return false;
            // Checksum: sum of all char codes in the two 5-char groups must be divisible by 7
            const parts = key.split('-');
            const chars = parts[1] + parts[2];
            let sum = 0;
            for (let i = 0; i < chars.length; i++) sum += chars.charCodeAt(i);
            return sum % 7 === 0;
        }

        function submitProKey() {
            const userInput = document.getElementById('pro-key-input').value.trim();
            if (btoa(userInput) === "QWRtaW5NZWhkaTA0") {
                unlockedKey = true;
                currentProgress = 101;
                saveProgress();
                updateXPDisplay();
                renderMap();
                closeProModal();
                showToast("Tous les niveaux débloqués !");
            } else if (userInput === "JKLMehdi04" || isValidProKey(userInput)) {
                unlockedKey = true;
                saveProgress();
                updateXPDisplay();
                closeProModal();
                showToast("Bienvenue dans PyLingo Pro !");
            } else {
                showToast("Clé incorrecte. Essaie encore !");
            }
        }

        // --- 11. NOTIFICATIONS DE RAPPEL ---
        let reminderTimeout;
        
        function requestNotifications() {
            if (!("Notification" in window)) {
                alert("Ce navigateur ne supporte pas les notifications.");
                return;
            }
            
            Notification.requestPermission().then(permission => {
                const notifBtn = document.getElementById('notif-btn');
                if (permission === "granted") {
                    notifBtn.classList.replace('text-gray-500', 'text-yellow-400');
                    notifBtn.innerHTML = '<i class="ph-fill ph-bell text-lg"></i>';
                    showToast("Rappels activés !");
                } else {
                    showToast("Notifications refusées.");
                }
            });
        }
        
        // Gérer le départ et retour sur l'onglet
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") {
                // L'utilisateur quitte l'application ou minimise
                if ("Notification" in window && Notification.permission === "granted") {
                    // On planifie un rappel au bout de 1 heure (3600000 ms).
                    // Pour que tu puisses tester facilement, je l'ai mis à 30 secondes (30000 ms).
                    reminderTimeout = setTimeout(() => {
                        new Notification("PyLingo 🐍", {
                            body: "Il est temps de continuer tes leçons Python ! Ton XP t'attend.",
                            icon: "apple-touch-icon.png",
                            badge: "apple-touch-icon.png",
                            vibrate: [200, 100, 200]
                        });
                    }, 30000); // Remplacer par 3600000 pour 1h en conditions réelles
                }
            } else {
                // L'utilisateur revient
                if (reminderTimeout) {
                    clearTimeout(reminderTimeout);
                }
            }
        });
        
        function initNotifButton() {
            if ("Notification" in window && Notification.permission === "granted") {
                const notifBtn = document.getElementById('notif-btn');
                if (notifBtn) {
                    notifBtn.classList.replace('text-gray-500', 'text-yellow-400');
                    notifBtn.innerHTML = '<i class="ph-fill ph-bell text-lg"></i>';
                }
            }
        }

        // Lancement !
        window.addEventListener('load', () => {
            init();
            initNotifButton();
        });

    </script>
</body>
